name: HUB CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: hub-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests and frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  promote:
    name: Create promotion PR after five successful develop runs
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Count successful runs since the latest main commit
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          since="$(gh api "repos/$REPO/commits/main" --jq '.commit.committer.date')"
          successful="$(gh run list --repo "$REPO" --workflow ci.yml --branch develop \
            --event push --status success --limit 100 \
            --json createdAt | jq --arg since "$since" \
            '[.[] | select(.createdAt > $since)] | length')"
          # This run has passed tests but is still in progress.
          total=$((successful + 1))
          echo "Successful develop runs since main: $total"
          if (( total >= 5 )); then
            echo 'promote=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Open promotion PR
        if: steps.count.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Configure PROMOTION_TOKEN to create the promotion PR.'
            exit 1
          fi
          existing="$(gh pr list --repo "$REPO" --base main --head develop \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Promotion PR already exists: #$existing"
            exit 0
          fi
          gh pr create --repo "$REPO" --base main --head develop \
            --title '[AUTO-PROMOTE] develop to main after 5 successful runs' \
            --body 'Five successful develop CI runs occurred since the latest main commit. This PR is tested against main before merge.'

  merge-promotion:
    name: Merge approved promotion
    needs: tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, '[AUTO-PROMOTE]')
    runs-on: ubuntu-latest
    steps:
      - name: Merge develop into main
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Configure PROMOTION_TOKEN to merge the promotion PR.'
            exit 1
          fi
          gh pr merge "$PR_URL" --auto --merge --match-head-commit "$HEAD_SHA"

  report-promotion-failure:
    name: Report failed promotion
    needs: tests
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, '[AUTO-PROMOTE]') &&
      needs.tests.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed promotion
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Configure PROMOTION_TOKEN to create the failure issue.'
            exit 1
          fi
          title="[CI] Failed promotion of develop to main - PR #$PR_NUMBER"
          existing="$(gh issue list --repo "$REPO" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Failure issue already exists: #$existing"
            exit 0
          fi
          gh issue create --repo "$REPO" --title "$title" \
            --body "$(printf 'Promotion PR failed CI against main.\n\nPR: %s\nRun: %s\n' "$PR_URL" "$RUN_URL")"
