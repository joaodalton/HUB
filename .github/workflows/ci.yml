name: HUB CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    
permissions:
  contents: read

concurrency:
  group: hub-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests and frontend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      SECRET_ENCRYPTION_KEY: ${{ secrets.CI_SECRET_ENCRYPTION_KEY || 'b3BlbnNlc2FtZW9wZW5zZXNhbWVvcGVuc2VzYW1lb3A=' }}
      FLASK_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Audit backend dependencies
        working-directory: backend
        run: |
          python -m pip_audit -r requirements.txt --strict || echo "::warning::pip-audit encontrou vulnerabilidades (nao bloqueante ate o pin de versoes)"

      - name: Migrations em banco vazio (SQLite)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///ci_empty.db
        run: |
          python -m flask --app app db upgrade
          python -m flask --app app db current | grep -q "(head)"

      - name: Migrations em banco vazio (PostgreSQL)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://hub:hub@localhost:5432/hub_ci
        run: |
          python -m flask --app app db upgrade
          python -m flask --app app db current | grep -q "(head)"

      - name: Run backend tests
        working-directory: backend
        timeout-minutes: 15
        run: |
          python -m pytest -n auto

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
