[pytest]
testpaths = tests
python_files = test_*.py
# Os testes sao classes unittest; pytest os coleta nativamente. Com -n auto
# (pytest-xdist) cada worker e um processo: o isolamento por classe
# (SQLite temporario + Config/env restaurados em prepare_test_runtime) continua valendo.
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
